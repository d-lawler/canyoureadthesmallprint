[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# image decoding is slow unoptimised; keep tests usable
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
